# Live hook telemetry — receives real-time events from a running Claude Code session.
#
# Usage:
#   export CLI_DM_HOOK_TOKEN=dungeon-live-2026
#   make dev-watch CONFIG=dungeon-hooks.yaml
#   (or: go run ./cmd/cli-dm -config dungeon-hooks.yaml)
#
# Then open http://localhost:8420 and start any Claude Code session — it lights up live.
#
# Hook token must match CLI_DM_HOOK_TOKEN in your environment (used by scripts/cli-dm-hook.sh).
# hooks_auth in this file and CLI_DM_HOOK_TOKEN must be identical.

adapter: claude
port: 8420
hooks_auth: "dungeon-live-2026"

agents:
  # Receives live events from your interactive Claude Code session via hooks.
  # The agent appears and animates as you use tools in any Claude Code terminal.
  - name: "Live Session"
    role: rogue
    source: hooks
    task: "Active Session"

  # Receives live events from a running Cursor session via cursor-dm-relay.py.
  # Start the relay with: make cursor-relay  (in a separate terminal)
  - name: "Cursor Agent"
    role: mage
    source: hooks
    task: "Cursor Session"

sessions:
  # Disabled during live dev — every hook event was synced to disk and added I/O overhead.
  # Set enabled: true when you need session replay via `cli-dm sessions show`.
  enabled: false
  retention_days: 30
