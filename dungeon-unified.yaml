# One command to rule them all.
#
# - Claude Code   → live events via hooks (wired in ~/.claude/settings.json)
# - Cursor        → JSONL tailed automatically from ~/.cursor/projects/
# - Codex / any JSONL-based agent → auto-discovered under watch_dir
# - Any tool using the hooks protocol → POST to http://localhost:8420/api/hooks
#
# Usage:
#   export CLI_DM_HOOK_TOKEN=dungeon-live-2026
#   make dev

adapter: claude
port: 8420
hooks_auth: "dungeon-live-2026"

# Auto-discover Codex and any other JSONL-based agent active under this dir.
# Cursor is handled in real-time by the relay (started automatically by make dev),
# so watch_skip_cursor: true prevents duplicate agents for the same Cursor session.
watch_dir: "~/dev/nu/"
watch_age: "24h"
watch_skip_cursor: true

agents:
  # Receives live Claude Code events via the hooks relay in settings.json.
  # Any other tool using scripts/cli-dm-hook.sh lands here too.
  - name: "Claude Code"
    role: rogue
    source: hooks
    task: "Live Session"

sessions:
  enabled: false
  retention_days: 30
